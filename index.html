<!DOCTYPE html> <!-- Declares the document type and version of HTML (HTML5) -->

<html> <!-- Opens the HTML document -->

	<!-- https://www.w3schools.com/w3css/default.asp -->	<!-- Reference link to W3.CSS documentation -->

   <head>    <!-- Opens the head section for metadata and links. part of your HTML document that contains information about the webpage, rather than the content you see on the page itself.

 -->

      <title>Hello World</title>        <!-- Sets the title of the webpage shown in the browser tab -->

      <meta name="viewport" content="width=device-width, initial-scale=1">       <!-- Makes the page responsive on mobile devices -->

      <meta name="apple-mobile-web-app-capable" content="yes">      <!-- Allows the page to behave like a native app on Apple devices -->

      <link rel="stylesheet" href="w3.css">      <!-- Links to the W3.CSS stylesheet for styling -->

      <link rel="stylesheet" href="w3-colors-flat.css">      <!-- Links to a W3.CSS color theme stylesheet for flat colors -->

   </head>    <!-- Closes the head section -->

   
   <body>    <!-- Opens the body of the webpage (visible content goes here) -->


     	<header class="w3-container w3-flat-carrot"> 		<!-- Header section with W3.CSS container and flat carrot color.w3-container = an easy way to make content look neat and readable using W3.CSS.
It’s like putting your content in a nicely padded box.

 -->

		<h1>My Hello World App!</h1> 		<!-- Main heading inside the header -->

	</header> 	<!-- Closes the header -->


	<div class="w3-container"> <!-- place main content here and it will show up between header and footer.-->	<!-- Main content container using W3.CSS class -->

		
		<p>Hello World! (Athitiya) is here.</p>		

	</div>	<!-- Closes the main content container -->

	
	<footer class="w3-bottom w3-container w3-flat-carrot"> 	<!-- Footer fixed to bottom with W3.CSS container and color class -->

		<p>This is the footer!</p>		<!-- Text inside the footer -->

	</footer>	<!-- Closes the footer -->

	   
   </body>   <!-- Closes the body of the page -->

</html><!-- Closes the HTML document -->
